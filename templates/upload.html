<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillBridge - Upload Resume</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
    <h1>Upload Your Resume</h1>

    <form action="/upload" method="post" enctype="multipart/form-data">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="{{ category }}-message">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

        <div class="upload-icon">
            <span class="upload-arrow">↑</span>
        </div>
        <h2>Choose your resume file</h2>
        <p>Upload your PDF or DOCX file to get started</p>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" class="file-input" required>
        <button type="submit">Upload Resume</button>
    </form>
</body>
</html>
